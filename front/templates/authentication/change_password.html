{% extends 'shared/base.html' %}
{% block title %}Change password{% endblock %}
{% block crumb %}Change password{% endblock %}
{% block content %}
<div class="page-heading"><div><div class="eyebrow">ACCOUNT SECURITY</div><h1>Change password</h1><p class="muted">Confirm your current password and authenticator code first.</p></div></div>
<section class="panel team-form-panel" style="max-width:560px">
  <form method="post" class="team-form">
    <div class="field"><label for="current_password">Current password</label><input id="current_password" name="current_password" type="password" autocomplete="current-password" required></div>
    <div class="field"><label for="code">Six-digit authenticator code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456" required></div>
    <div class="field"><label for="new_password">New password</label><input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" required><small>Use at least 12 characters.</small></div>
    <div class="field"><label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></div>
    <button class="button primary" type="submit">Update password</button>
  </form>
</section>
{% endblock %}
